name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload G01 visual acceptance pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g01-visual-acceptance-${{ github.run_number }}
          path: test-results/visual-acceptance
          # PR-A visuals are uploaded independently by G01 PR-A Gate.
          if-no-files-found: error
          retention-days: 14
