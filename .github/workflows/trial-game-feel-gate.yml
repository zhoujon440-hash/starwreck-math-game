name: Trial Game Feel Gate

on:
  push:
    branches:
      - codex/trial-experience-shell-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  trial-game-feel-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore SHA-256 verified formal source mirror
        run: node scripts/restore-formal-source-mirror.mjs
      - run: npm ci
      - run: npm run validate:sources
      - run: npm run validate:baseline
      - run: npm run test:baseline
      - run: npm run validate:characters
      - run: npm run test:characters
      - run: npm run validate:character-story
      - run: npm run test:character-story
      - run: npm run validate:g01-pr-a
      - run: npm run test:g01-pr-a
      - run: npm run validate:g01-pr-b
      - run: npm run test:g01-pr-b
      - run: npm run validate:g01-demo
      - run: npm run test:g01-demo
      - run: npm run validate:g02-slice-01
      - run: npm run test:g02-slice-01
      - run: npm run validate:trial-experience
      - run: npm run test:trial-experience
      - run: npm run validate:game-feel
      - run: npm run test:game-feel
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run full Playwright acceptance at 1366x768 and 1920x1080
        run: npm run test:e2e
      - run: npm run test:pwa
      - run: npm run package:trial-experience
      - name: Verify deterministic production ZIP and checksum
        shell: bash
        run: |
          first_sha="$(sha256sum release/starwreck-trial-0.4.0.zip | cut -d ' ' -f 1)"
          npm run package:trial-experience
          second_sha="$(sha256sum release/starwreck-trial-0.4.0.zip | cut -d ' ' -f 1)"
          test "$first_sha" = "$second_sha"
          grep -Fq "$second_sha  starwreck-trial-0.4.0.zip" release/starwreck-trial-0.4.0.sha256
      - name: Upload Game Feel visual acceptance, video and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-game-feel-visual-acceptance-${{ github.run_number }}
          path: |
            test-results/trial-game-feel/**
            test-results/trial-game-feel-recorded/**
            test-results/**/*.webm
            test-results/**/*.zip
            playwright-report/**
            docs/review/TRIAL_GAME_FEEL_ARCHITECTURE.md
            docs/review/TRIAL_EXPERIENCE_VISUAL_ACCEPTANCE.md
            docs/art/TRIAL_EXPERIENCE_ASSET_PROVENANCE.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload production ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: starwreck-trial-0.4.0-${{ github.run_number }}
          path: |
            release/starwreck-trial-0.4.0.zip
            release/starwreck-trial-0.4.0.sha256
          if-no-files-found: error
          retention-days: 30
