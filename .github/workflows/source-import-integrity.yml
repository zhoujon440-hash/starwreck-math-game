name: Source Import Integrity

on:
  pull_request:
    paths:
      - ".gitattributes"
      - "archive/legacy/**"
      - "data/source/**"
      - "docs/baseline/**"
      - "docs/story/G01-G13/**"
      - "scripts/import_source_baseline.py"
      - "scripts/baseline*.mjs"
      - "scripts/validate-source-import.mjs"
      - "scripts/restore-formal-source-mirror.mjs"
      - "config/baseline-policy.json"
      - "source_packages/**"
      - "package.json"
  push:
    paths:
      - ".gitattributes"
      - "archive/legacy/**"
      - "data/source/**"
      - "docs/baseline/**"
      - "docs/story/G01-G13/**"
      - "scripts/import_source_baseline.py"
      - "scripts/baseline*.mjs"
      - "scripts/validate-source-import.mjs"
      - "scripts/restore-formal-source-mirror.mjs"
      - "config/baseline-policy.json"
      - "source_packages/**"
      - "package.json"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore SHA-256 verified formal source mirror
        run: node scripts/restore-formal-source-mirror.mjs
      - name: Verify imported source packages, extraction, and catalogs
        env:
          REQUIRE_LFS_OBJECTS: "1"
        run: npm run validate:sources
