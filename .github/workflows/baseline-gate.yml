name: baseline-gate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/baseline-validation-v1

jobs:
  baseline-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without Git LFS bandwidth dependency
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore SHA-256 verified formal source mirror
        run: node scripts/restore-formal-source-mirror.mjs
      - name: Install dependencies
        run: npm ci
      - name: Validate source import integrity
        env:
          REQUIRE_LFS_OBJECTS: "1"
        run: npm run validate:sources
      - name: Validate frozen baseline
        run: npm run validate:baseline
      - name: Run positive and destructive baseline tests
        run: npm run test:baseline
      - name: Run unit tests
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
