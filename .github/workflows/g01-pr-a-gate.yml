name: G01 PR-A Gate

on:
  push:
    branches:
      - codex/g01-scenes-02-03-v1
  pull_request:
    branches:
      - main

jobs:
  g01-pr-a-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify production inputs, manifests and runtime SHA-256
        run: npm run validate:g01-pr-a
      - run: npm run validate:sources
      - run: npm run validate:baseline
      - run: npm run test:baseline
      - run: npm run validate:characters
      - run: npm run test:characters
      - run: npm run validate:character-story
      - run: npm run test:character-story
      - run: npm run test:g01-pr-a
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload G01 PR-A visual acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g01-pr-a-visual-acceptance-${{ github.run_number }}
          path: |
            test-results/g01-pr-a-visual/**
            playwright-report/**
            docs/review/G01_PR_A_VISUAL_ACCEPTANCE.md
            docs/story-runtime/G01_PR_A_SCENES_02_03.md
            docs/art/G01_PR_A_RUNTIME_ASSET_PROVENANCE.json
            docs/art/G01_PR_A_RUNTIME_ASSET_SHA256.txt
            data/source/g01/pr-a/**
          if-no-files-found: error
          retention-days: 30
